<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PhoneCloud architecture diagram">
  <defs>
    <marker id="arrow-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#8b8df0"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#67d5ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#6ee7b7"/>
    </marker>
    <style>
      .bg { fill: #08090a; }
      .grid { stroke: #161a23; stroke-width: 1; opacity: .5; }
      .frame { fill: #0a0c10; stroke: #1d2330; stroke-width: 1.4; }
      .panel { fill: #0e1117; stroke: #273044; stroke-width: 1.3; }
      .card, .chip, .footer-chip { fill: #111620; stroke: #30384c; stroke-width: 1.1; }
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill: #f1f5ff; font-size: 28px; font-weight: 780; letter-spacing: 0; }
      .subtitle { fill: #9ba6bb; font-size: 15px; }
      .label { font-size: 13px; font-weight: 760; letter-spacing: 1.4px; text-transform: uppercase; }
      .body { fill: #f1f5ff; font-size: 14px; }
      .strong { font-weight: 720; }
      .small { font-size: 12.5px; }
      .muted { fill: #9ba6bb; font-size: 12px; }
      .dim { fill: #727d91; font-size: 11px; }
      .purple { fill: #8b8df0; }
      .cyan { fill: #67d5ff; }
      .green { fill: #6ee7b7; }
      .amber { fill: #f7c873; }
      .purple-fill { fill: #8b8df0; }
      .cyan-fill { fill: #67d5ff; }
      .green-fill { fill: #6ee7b7; }
      .amber-fill { fill: #f7c873; }
      .arrow { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .purple-stroke { stroke: #8b8df0; }
      .cyan-stroke { stroke: #67d5ff; }
      .green-stroke { stroke: #6ee7b7; }
    </style>
  </defs>

  <rect width="960" height="560" class="bg"/>
  <path d="M 40 88 V 520" class="grid"/><path d="M 104 88 V 520" class="grid"/><path d="M 168 88 V 520" class="grid"/><path d="M 232 88 V 520" class="grid"/><path d="M 296 88 V 520" class="grid"/><path d="M 360 88 V 520" class="grid"/><path d="M 424 88 V 520" class="grid"/><path d="M 488 88 V 520" class="grid"/><path d="M 552 88 V 520" class="grid"/><path d="M 616 88 V 520" class="grid"/><path d="M 680 88 V 520" class="grid"/><path d="M 744 88 V 520" class="grid"/><path d="M 808 88 V 520" class="grid"/><path d="M 872 88 V 520" class="grid"/><path d="M 936 88 V 520" class="grid"/>
  <path d="M 32 100 H 928" class="grid"/><path d="M 32 152 H 928" class="grid"/><path d="M 32 204 H 928" class="grid"/><path d="M 32 256 H 928" class="grid"/><path d="M 32 308 H 928" class="grid"/><path d="M 32 360 H 928" class="grid"/><path d="M 32 412 H 928" class="grid"/><path d="M 32 464 H 928" class="grid"/>
  <rect x="16" y="16" width="928" height="528" rx="28" class="frame"/>
  <circle cx="825" cy="96" r="78" fill="#8b8df0" opacity=".055"/>
  <circle cx="108" cy="476" r="58" fill="#6ee7b7" opacity=".045"/>

  <text x="40" y="58" class="title" >PhoneCloud</text>
  <text x="40" y="82" class="subtitle" >Typed job fabric across phones and PCs with leased execution and operator visibility</text>

  
    <rect x="40" y="110" width="200" height="320" rx="22" class="panel"/>
    <text x="64" y="146" class="label purple">Surfaces</text>
  
      <rect x="64" y="174" width="152" height="32" rx="10" class="chip"/>
      <circle cx="82" cy="190" r="4" class="purple-fill"/>
      <text x="96" y="195" class="body strong small">CLI</text>
      <rect x="64" y="218" width="152" height="32" rx="10" class="chip"/>
      <circle cx="82" cy="234" r="4" class="purple-fill"/>
      <text x="96" y="239" class="body strong small">Python SDK</text>
      <rect x="64" y="262" width="152" height="32" rx="10" class="chip"/>
      <circle cx="82" cy="278" r="4" class="purple-fill"/>
      <text x="96" y="283" class="body strong small">Next.js console</text>
      <rect x="64" y="306" width="152" height="32" rx="10" class="chip"/>
      <circle cx="82" cy="322" r="4" class="purple-fill"/>
      <text x="96" y="327" class="body strong small">Android app</text>

  
    
    <rect x="280" y="110" width="400" height="166" rx="22" class="panel"/>
    <text x="304" y="146" class="label cyan">FastAPI Control Plane</text>
    
    <rect x="304" y="168" width="352" height="32" rx="11" class="card"/>
    <rect x="304" y="168" width="5" height="32" rx="3" class="cyan-fill"/>
    <text x="322" y="189" class="body strong">72 routes</text>
    <text x="466" y="189" class="body muted">nodes, jobs, artifacts</text>
    <rect x="304" y="206" width="352" height="32" rx="11" class="card"/>
    <rect x="304" y="206" width="5" height="32" rx="3" class="cyan-fill"/>
    <text x="322" y="227" class="body strong">Scheduler</text>
    <text x="466" y="227" class="body muted">capability weighted</text>
    <rect x="304" y="244" width="352" height="32" rx="11" class="card"/>
    <rect x="304" y="244" width="5" height="32" rx="3" class="cyan-fill"/>
    <text x="322" y="265" class="body strong">Telemetry</text>
    <text x="466" y="265" class="body muted">SSE + event logs</text>
  
    
    <rect x="280" y="292" width="400" height="166" rx="22" class="panel"/>
    <text x="304" y="328" class="label green">Worker Fleet</text>
    
    <rect x="304" y="350" width="352" height="32" rx="11" class="card"/>
    <rect x="304" y="350" width="5" height="32" rx="3" class="green-fill"/>
    <text x="322" y="371" class="body strong">PC agents</text>
    <text x="466" y="371" class="body muted">Python runtimes</text>
    <rect x="304" y="388" width="352" height="32" rx="11" class="card"/>
    <rect x="304" y="388" width="5" height="32" rx="3" class="green-fill"/>
    <text x="322" y="409" class="body strong">Android workers</text>
    <text x="466" y="409" class="body muted">foreground service</text>
    <rect x="304" y="426" width="352" height="32" rx="11" class="card"/>
    <rect x="304" y="426" width="5" height="32" rx="3" class="green-fill"/>
    <text x="322" y="447" class="body strong">Adapters</text>
    <text x="466" y="447" class="body muted">Ollama, llama.cpp, shell</text>

  
    <rect x="720" y="110" width="200" height="320" rx="22" class="panel"/>
    <text x="744" y="146" class="label amber">State + Ops</text>
  
      <rect x="744" y="174" width="152" height="32" rx="10" class="chip"/>
      <circle cx="762" cy="190" r="4" class="amber-fill"/>
      <text x="776" y="195" class="body strong small">Postgres</text>
      <rect x="744" y="218" width="152" height="32" rx="10" class="chip"/>
      <circle cx="762" cy="234" r="4" class="amber-fill"/>
      <text x="776" y="239" class="body strong small">Redis Streams</text>
      <rect x="744" y="262" width="152" height="32" rx="10" class="chip"/>
      <circle cx="762" cy="278" r="4" class="amber-fill"/>
      <text x="776" y="283" class="body strong small">MinIO artifacts</text>
      <rect x="744" y="306" width="152" height="32" rx="10" class="chip"/>
      <circle cx="762" cy="322" r="4" class="amber-fill"/>
      <text x="776" y="327" class="body strong small">Vault leases</text>
      <rect x="744" y="350" width="152" height="32" rx="10" class="chip"/>
      <circle cx="762" cy="366" r="4" class="amber-fill"/>
      <text x="776" y="371" class="body strong small">Prometheus/Grafana</text>

  <rect x="40" y="462" width="880" height="58" rx="20" class="panel"/>
  <text x="64" y="497" class="label green" >Key signals</text>
  
      <rect x="184" y="478" width="144" height="26" rx="13" class="footer-chip"/>
      <text x="256" y="496" class="dim" text-anchor="middle">mTLS pairing</text>
      <rect x="358" y="478" width="144" height="26" rx="13" class="footer-chip"/>
      <text x="430" y="496" class="dim" text-anchor="middle">lease renewals</text>
      <rect x="532" y="478" width="144" height="26" rx="13" class="footer-chip"/>
      <text x="604" y="496" class="dim" text-anchor="middle">DLQ recovery</text>
      <rect x="706" y="478" width="144" height="26" rx="13" class="footer-chip"/>
      <text x="778" y="496" class="dim" text-anchor="middle">metering summaries</text>

  <path d="M 240 270 C 260 270, 260 190, 280 190" class="arrow purple-stroke" marker-end="url(#arrow-purple)"/>
  <path d="M 480 276 L 480 292" class="arrow cyan-stroke" marker-end="url(#arrow-cyan)"/>
  <path d="M 680 190 C 704 190, 700 270, 720 270" class="arrow cyan-stroke" marker-end="url(#arrow-cyan)"/>
  <path d="M 680 380 C 704 380, 700 314, 720 314" class="arrow green-stroke" marker-end="url(#arrow-green)"/>
  <path d="M 480 458 L 480 462" class="arrow green-stroke" marker-end="url(#arrow-green)"/>
</svg>
